version: '3.8'

services:
  # Base de données MySQL
  mysql:
    image: mysql:8.0
    container_name: smartshop-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: smartshop_db
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_USER: smartshop
      MYSQL_PASSWORD: smartshop123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - smartshop-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Application Spring Boot
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartshop-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smartshop_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: smartshop
      SPRING_DATASOURCE_PASSWORD: smartshop123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - smartshop-network

networks:
  smartshop-network:
    driver: bridge

volumes:
  mysql_data:
