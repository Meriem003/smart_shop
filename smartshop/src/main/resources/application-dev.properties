server.port=8080
spring.application.name=SmartShop

# Base de données H2 en mémoire pour le développement
spring.datasource.url=jdbc:h2:mem:smartshop_db;DB_CLOSE_ON_EXIT=FALSE;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# Ordre d'initialisation : d'abord les tables, puis les données (désactivé car utilisation du DataLoader)
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never

# Console H2 accessible à http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Configuration TVA
app.tva.taux=0.20

server.servlet.session.timeout=160m
server.servlet.session.cookie.http-only=true

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html