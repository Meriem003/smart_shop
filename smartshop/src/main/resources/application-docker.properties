# Profil Docker
server.port=8080
spring.application.name=SmartShop

# Configuration base de données (sera surchargée par les variables d'environnement)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/smartshop_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:smartshop}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:smartshop123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Configuration TVA
app.tva.taux=0.20

# Session
server.servlet.session.timeout=160m
server.servlet.session.cookie.http-only=true

# Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
